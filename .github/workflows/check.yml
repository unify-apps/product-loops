# Runs the same check a person runs before a pull request: the skill copies match shared/, every skill has a
# sound shape, and every test passes. No packages to install: the scripts use Node alone.
name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
